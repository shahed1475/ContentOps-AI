version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: contentops_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: contentops_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contentops_ai"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    container_name: contentops_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-password123}@postgres:5432/contentops_ai"
      JWT_SECRET: "${JWT_SECRET:-dev-only-change-me}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-dev-only-change-me-too}"
      PORT: 8000
      NODE_ENV: production
      ALLOWED_ORIGINS: http://localhost:5173
    command: >
      sh -c "npx prisma migrate deploy && npm run start"

  frontend:
    build: ./frontend
    container_name: contentops_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8000"
    stdin_open: true
    tty: true

volumes:
  postgres_data:
